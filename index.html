<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shower Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    
    <link rel="apple-touch-icon" href="icon.png?v=pearl-2">
    <link rel="icon" type="image/png" href="icon.png?v=pearl-2">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <style>
        :root {
            --cloud-bg: rgba(255, 255, 255, 0.18);
            --cloud-blur: 20px;
            --session-yellow: #ffeb3b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            background-image: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            touch-action: none;
            transition: background-image 1s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (orientation: portrait) {
            #clock-container {
                transform: rotate(90deg);
                width: 92vh !important; 
                height: 85vw !important; 
                padding: 6vw 5vh !important;
                border-radius: 8vh !important;
            }
            #time { font-size: 16vh !important; }
            #time span { width: 1.1ch !important; }
            #time .colon { width: 0.6ch !important; }
            #seconds, #ampm { font-size: 5vh !important; }
            #info-row { margin-top: 15px !important; padding-top: 15px !important; }
            .info-label { font-size: 2.5vh !important; }
            #stopwatch { font-size: 6.5vh !important; }
            #stopwatch span { width: 1.1ch !important; }
            .weather-icon { width: 18vh !important; height: 18vh !important; }
            #weather-temp { font-size: 4vh !important; }
        }

        #clock-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5vh 5vw;
            width: 92vw;
            box-sizing: border-box;
            background: var(--cloud-bg);
            backdrop-filter: blur(var(--cloud-blur));
            -webkit-backdrop-filter: blur(var(--cloud-blur));
            border-radius: 6vw;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        #time-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: center;
            white-space: nowrap;
            color: #ffffff;
        }

        #time span, #seconds span, #stopwatch span {
            display: inline-block;
            text-align: center;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        #time {
            font-size: 16vw; 
            line-height: 1;
            font-weight: 700;
            text-shadow: 0 8px 15px rgba(0,0,0,0.2);
            display: flex;
        }

        #time span { width: 1.1ch; } 
        #time .colon { width: 0.5ch; }

        #seconds {
            font-size: 4.5vw;
            margin-left: 20px;
            font-weight: 400;
            opacity: 0.9;
            display: flex;
        }
        #seconds span { width: 1.2ch; }

        #ampm {
            font-size: 4.5vw;
            margin-left: 10px;
            font-weight: 400;
            width: 3ch;
            text-align: left;
        }

        #info-row {
            width: 100%;
            margin-top: 3vw;
            padding-top: 3vw;
            border-top: 2px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
        }

        #weather-wrapper, #stopwatch-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .info-label {
            font-size: 2.5vw;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
            color: var(--session-yellow);
            margin-bottom: 5px;
        }

        #weather-icon-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .weather-icon {
            width: 16vw;
            height: 16vw;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
        }

        #weather-temp {
            position: absolute;
            font-size: 3.5vw;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 2;
        }

        #stopwatch {
            font-size: 6.5vw;
            font-weight: 700;
            color: #ffffff;
            display: flex;
        }
        #stopwatch span { width: 1.1ch; }
        #stopwatch .colon { width: 0.5ch; }

        #stopwatch-row {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #reset-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            padding: 10px;
            margin-left: 10px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        #reset-btn:active { color: var(--session-yellow); transform: scale(0.9); }
        #reset-btn svg { width: 4vw; height: 4vw; fill: currentColor; }

        #myhyundai-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
        }
        #myhyundai-btn svg { width: 4vw; height: 4vw; fill: currentColor; }

        #clock-container:active {
            transform: scale(0.98) !important;
        }
    </style>
    <link rel="stylesheet" href="pearl.css">
<link rel="stylesheet" href="weather-motion.css?v=1">
<link rel="stylesheet" href="themes.css?v=1"></head>
<body>

    <div id="clock-container">
        <div id="time-wrapper">
            <div id="time"></div>
            <div id="seconds"></div>
            <div id="ampm"></div>
        </div>

        <div id="info-row">
            <div id="weather-wrapper">
                <div id="weather-icon-container">

                    <svg viewBox="0 0 100 100" class="weather-icon" id="dynamic-weather-svg">
                        <path d="M 20 75 C 5 75 5 50 20 50 C 20 30 50 25 60 40 C 80 35 95 60 80 75 Z" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="3" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <div id="stopwatch-wrapper">
                <div class="info-label">Session</div>
                <div id="stopwatch-row">
                    <div id="stopwatch"></div>
                    <button id="reset-btn" aria-label="Reset Timer">
                        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <a id="myhyundai-btn" aria-label="Open MyHyundai" href="shortcuts://run-shortcut?name=MyHyundai">
            <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
        </a>
    </div>

    <script src="weather-art.js?v=2"></script>
    <button id="theme-toggle" type="button" aria-label="Switch clock theme">Swipe right · Walnut →</button>
    <span id="theme-status" role="status" aria-live="polite"></span>
    <script src="themes.js?v=1"></script>
    <script>
        let sessionStartTime = Date.now();
        let is24Hour = false;

        function createSpannedText(text) {
            return text.split('').map(char => {
                const className = char === ':' ? 'class="colon"' : '';
                return `<span ${className}>${char}</span>`;
            }).join('');
        }

        const lastText = {};
        function updateDigits(id, value) {
            if (lastText[id] === value) return;
            lastText[id] = value;
            const node = document.getElementById(id);
            if (node.children.length !== value.length) node.innerHTML = createSpannedText(value);
            else Array.from(node.children).forEach((span, i) => { if (span.textContent !== value[i]) span.textContent = value[i]; });
        }

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = String(now.getMinutes()).padStart(2, '0');
            let s = String(now.getSeconds()).padStart(2, '0');
            
            let ampmText = '';
            if (!is24Hour) {
                ampmText = h >= 12 ? 'PM' : 'AM';
                h = h % 12 || 12;
                document.getElementById('ampm').style.display = 'block';
            } else {
                h = String(h).padStart(2, '0');
                document.getElementById('ampm').style.display = 'none';
            }
            
            updateDigits('time', `${h}:${m}`);
            updateDigits('seconds', s);
            document.getElementById('ampm').textContent = ampmText;

            const elapsedMs = Date.now() - sessionStartTime;
            const totalSeconds = Math.floor(elapsedMs / 1000);
            const stopM = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const stopS = String(totalSeconds % 60).padStart(2, '0');
            updateDigits('stopwatch', `${stopM}:${stopS}`);
        }

        function protectScreen() {
            const container = document.getElementById('clock-container');
            const isPortrait = window.innerHeight > window.innerWidth;
            const baseRotation = isPortrait ? 90 : 0;
            
            const randomX = Math.floor(Math.random() * 10) - 5; 
            const randomY = Math.floor(Math.random() * 10) - 5;
            container.style.transform = `rotate(${baseRotation}deg) translate(${randomX}px, ${randomY}px)`;
        }

        const FALLBACK_LAT = 40.6387; 
        const FALLBACK_LON = -74.3915;

        function fetchWeatherData(lat, lon) {
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit`)
                .then(res => res.json())
                .then(data => {
                    const temp = Math.round(data.current_weather.temperature);
                    const code = data.current_weather.weathercode;
                    updateWeatherUI(temp, code, data.current_weather.is_day);
                })
                .catch(err => console.error("Weather error:", err));
        }

        function initWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => fetchWeatherData(pos.coords.latitude, pos.coords.longitude),
                    (err) => fetchWeatherData(FALLBACK_LAT, FALLBACK_LON),
                    { timeout: 5000 }
                );
            } else {
                fetchWeatherData(FALLBACK_LAT, FALLBACK_LON);
            }
        }

        document.getElementById('clock-container').addEventListener('click', () => {
            is24Hour = !is24Hour;
            updateClock();
        });

        document.getElementById('reset-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            sessionStartTime = Date.now();
            updateClock();
        });

        document.getElementById('myhyundai-btn').addEventListener('click', (e) => e.stopPropagation());

        setInterval(() => { if (!document.hidden) updateClock(); }, 1000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) updateClock(); });
        setInterval(() => { if (!document.hidden) protectScreen(); }, 60000); 
        setInterval(initWeather, 30 * 60 * 1000); 

        updateClock();
        protectScreen();
        updateWeatherUI(null, 3);
        initWeather();

        window.addEventListener('resize', protectScreen);
    </script>
</body>
</html>
